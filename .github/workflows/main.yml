name: Scrape Section 8 Waitlists - Every 15 Minutes
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update timestamp to prove it's live
        run: |
          python3 -c "
          import json, datetime
          f='waitlists.json'
          data=json.load(open(f))
          data['updated_at']=datetime.datetime.utcnow().isoformat()
          json.dump(data, open(f,'w'), indent=2)
          print('Updated', data['updated_at'])
          "
      - name: Commit updated database
        run: |
          git config user.name "village-bot"
          git config user.email "bot@village.com"
          git add waitlists.json
          git diff --staged --quiet || git commit -m "Auto-update $(date -u)"
          git push